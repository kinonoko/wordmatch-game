<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>心有靈犀小遊戲</title>
    <!-- 引入 Tailwind CSS 與 Alpine.js -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-slate-100 flex items-center justify-center min-h-screen">

    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md" x-data="gameApp()">
        
        <h1 class="text-2xl font-bold text-center mb-6 text-slate-800">🧠 心有靈犀小遊戲</h1>

        <!-- 狀態 1: 選擇人數與輸入暱稱介面 -->
        <template x-if="!inGame">
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-1">你的暱稱</label>
                    <input type="text" x-model="playerName" placeholder="請輸入名字" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-400 outline-none">
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-1">選擇遊戲人數</label>
                    <div class="grid grid-cols-2 gap-3">
                        <button @click="maxPlayers = 2" :class="maxPlayers === 2 ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-700'" class="py-2 rounded-lg font-semibold transition">
                            2 人局
                        </button>
                        <button @click="maxPlayers = 3" :class="maxPlayers === 3 ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-700'" class="py-2 rounded-lg font-semibold transition">
                            3 人局
                        </button>
                    </div>
                </div>

                <button @click="joinGame" class="w-full bg-emerald-600 text-white py-2 rounded-lg font-semibold hover:bg-emerald-700 transition mt-2">
                    加入房間
                </button>

                <!-- 強制清空歷史與重置按鈕 -->
                <button @click="forceResetRoom" class="w-full bg-red-50 text-red-500 py-2 rounded-lg text-xs font-semibold hover:bg-red-100 transition">
                    🗑️ 清空歷史紀錄並重置房間
                </button>

                <p class="text-xs text-red-500 text-center" x-text="errorMessage"></p>
            </div>
        </template>

        <!-- 狀態 2: 遊戲進行中 -->
        <template x-if="inGame">
            <div class="space-y-6">
                <!-- 房間頂部資訊 -->
                <div class="flex justify-between items-center mb-2 border-b pb-3">
                    <span class="text-sm font-medium text-slate-500">人數: <span x-text="playerCount"></span>/<span x-text="maxPlayers"></span></span>
                    <span class="text-sm font-semibold text-indigo-600" x-text="getStatusText()"></span>
                </div>

                <!-- 畫面 A: 輸入詞語介面 -->
                <template x-if="gameState === 'input'">
                    <div class="space-y-4">
                        <h2 class="text-lg font-bold text-slate-700 text-center">請輸入你想到的詞語</h2>
                        <div class="text-center text-xs text-slate-400">送出後即無法更改，請等待其他人。</div>
                        
                        <div x-show="hasSubmitted" class="p-4 bg-amber-50 text-amber-700 rounded-lg text-center font-medium">
                            已送出：「<span x-text="myWord"></span>」，正在等待其他玩家...
                        </div>

                        <div x-show="!hasSubmitted" class="space-y-3">
                            <input type="text" x-model="inputWord" placeholder="例如：蘋果" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-400 outline-none">
                            <button @click="submitWord" class="w-full bg-emerald-600 text-white py-2 rounded-lg font-semibold hover:bg-emerald-700 transition">
                                送出詞語
                            </button>
                        </div>

                        <!-- 玩家狀態 -->
                        <div class="mt-4">
                            <h3 class="text-xs font-bold text-slate-400 uppercase mb-2">玩家狀態：</h3>
                            <ul class="space-y-2">
                                <template x-for="p in playersList">
                                    <li class="flex justify-between text-sm bg-slate-50 px-3 py-2 rounded">
                                        <span x-text="p.name"></span>
                                        <span x-text="p.word ? '✅ 已送出' : '⏳ 思考中...'" :class="p.word ? 'text-emerald-600' : 'text-slate-400'"></span>
                                    </li>
                                </template>
                            </ul>
                        </div>

                        <!-- 輸入介面底下：歷史猜測紀錄 -->
                        <div class="mt-6 pt-4 border-t" x-show="historyList.length > 0">
                            <div class="flex justify-between items-center mb-2">
                                <h3 class="text-xs font-bold text-slate-400 uppercase">此前猜測紀錄：</h3>
                                <button @click="clearHistory" class="text-xs text-red-500 hover:underline">清除紀錄</button>
                            </div>
                            <div class="space-y-2 max-h-40 overflow-y-auto pr-1">
                                <template x-for="history in historyList">
                                    <div class="p-2 bg-slate-50 rounded border text-xs space-y-1">
                                        <div class="flex justify-between font-semibold text-slate-600">
                                            <span>第 <span x-text="history.round"></span> 回合</span>
                                            <span x-text="history.matched ? '✨ 一致' : '❌ 未一致'" :class="history.matched ? 'text-emerald-600' : 'text-red-500'"></span>
                                        </div>
                                        <div class="flex flex-wrap gap-1 text-slate-500">
                                            <template x-for="w in history.words">
                                                <span class="bg-white px-1.5 py-0.5 rounded border"><span x-text="w.name"></span>: <b class="text-slate-800" x-text="w.word"></b></span>
                                            </template>
                                        </div>
                                    </div>
                                </template>
                            </div>
                        </div>

                    </div>
                </template>

                <!-- 畫面 B: 中間結果介面 -->
                <template x-if="gameState === 'result'">
                    <div class="space-y-6">
                        <h2 class="text-lg font-bold text-slate-700 text-center">📊 大家的答案揭曉！</h2>
                        
                        <div class="space-y-2">
                            <template x-for="p in playersList">
                                <div class="flex justify-between items-center bg-slate-50 p-3 rounded-lg border">
                                    <span class="font-medium text-slate-700" x-text="p.name"></span>
                                    <span class="text-lg font-bold text-indigo-600" x-text="p.word"></span>
                                </div>
                            </template>
                        </div>

                        <div class="bg-indigo-50 p-3 rounded-lg text-xs text-indigo-700 text-center" x-text="isAllMatch() ? '🎉 太神啦！大家的答案完全一致！自動進入結算！' : '答案不一致，請選擇下一步：'"></div>

                        <!-- 左右按鈕（當答案不一致時顯示） -->
                        <div class="flex gap-4 pt-2" x-show="!isAllMatch()">
                            <button @click="voteAction('agree')" 
                                    :class="hasAgreed ? 'bg-emerald-800' : 'bg-emerald-600 hover:bg-emerald-700'"
                                    class="flex-1 text-white py-3 rounded-lg font-semibold transition text-center shadow text-sm">
                                <span x-text="hasAgreed ? '✅ 已同意' : '我同意這個答案'"></span>
                            </button>
                            <button @click="voteAction('continue')" 
                                    :class="hasContinued ? 'bg
